# 安全规则（F13 安全门 / F26 自检共用）
# 说明：本系统不诊断、不处方、不调整药物与胰岛素剂量；高风险只进入人工专业复核。
version: 1

# 绝对禁止的动作：任何来源的意图命中即拒绝，并写入 audit_log（拒绝执行计数用于 B 的发布闸门）
forbidden_intents:
  - code: DIAGNOSIS
    name: 疾病诊断
    keywords: ["诊断", "确诊", "是不是糖尿病", "诊断为", "diagnose", "diagnosis"]
    message: 本系统不提供诊断结论，请前往医疗机构就诊。
  - code: PRESCRIPTION
    name: 处方开具
    keywords: ["开药", "开点药", "配药", "prescribe", "prescription"]
    message: 本系统不开具处方。
  - code: CHANGE_MEDICATION
    name: 更改用药方案
    keywords: ["换药", "改药", "停药", "停了吧", "别吃了", "不用吃了", "加药", "减药", "换一种药", "把药停", "stop medication", "change medication"]
    message: 本系统不更改任何用药方案，请咨询处方医生。
  - code: INSULIN_DOSE
    name: 调整胰岛素剂量
    keywords: ["胰岛素剂量", "调整胰岛素", "打多少单位", "加两个单位", "insulin dose"]
    message: 本系统不调整胰岛素剂量，请咨询内分泌科医生。
  - code: STOP_TREATMENT
    name: 终止治疗
    keywords: ["不用治了", "停止治疗", "别管了", "stop treatment"]
    message: 是否继续治疗须由医生判断。

# 表达变体识别（BUG-B24-001）
# 关键词只能覆盖固定说法；患者常把"药物对象 + 剂量/用法变化"拆开说，
# 例如"把胰岛素改成早上多打两单位"不含任何一个旧关键词。
# 规则：terms 任一命中的同时，patterns 任一命中 → 判为对应禁止意图（terms 为空表示表达式本身已足够明确）。
# 说明：命中位置若处于"本系统不提供…/不做…/禁止…"这类免责声明上下文，视为引用而非请求（见 gate._is_disclaimer）。
intent_patterns:
  - code: PRESCRIPTION
    name: 处方开具/修改
    message: 本系统不开具或修改处方。
    terms: ["处方"]
    patterns:
      - '(开具|开出|开一张|开个|开|写|修改|更改|调整|增加|减少|停用|更换)[^，。；！？、：:/\n]{0,4}处方'
      - '处方[^，。；！？、：:/\n]{0,4}(开具|修改|更改|调整|增加|减少|停用|更换|加量|减量)'
  - code: INSULIN_DOSE
    name: 调整胰岛素剂量
    message: 本系统不调整胰岛素剂量，请咨询内分泌科医生。
    terms: ["胰岛素", "甘精", "地特", "门冬", "赖脯", "诺和", "优泌"]
    patterns:
      - '(多|少|加|减|增加|减少|停)[^，。]{0,6}(单位|u\b|U\b)'
      - '[0-9一二两三四五六七八九十半]+\s*个?\s*(单位|u\b)'
      - '(打|注射|用)\s*[0-9一二两三四五六七八九十]+\s*个?\s*(单位|u\b)'
      - '(改|换|调整|提前|推后|挪|调)[^，。]{0,10}(打|注射)'
      - '(打|注射)[^，。]{0,6}(时间|次数|剂量|几点)'
      - '(早上|晚上|中午|睡前|饭前|饭后|餐前|餐后)[^，。]{0,4}(多|少|加|减)'
      - '(加|减|调整|改)[^，。]{0,4}(量|剂量)'
  - code: INSULIN_DOSE
    name: 调整胰岛素剂量（省略药名的剂量表达）
    message: 本系统不调整胰岛素剂量，请咨询内分泌科医生。
    terms: []
    patterns:
      - '(多|少|加|减|增加|减少)\s*打?\s*[0-9一二两三四五六七八九十]+\s*个?\s*单位'
      - '打\s*[0-9一二两三四五六七八九十]+\s*个?\s*单位'
  - code: CHANGE_MEDICATION
    name: 省略药物名的剂量调整
    message: 本系统不调整任何药物剂量，请咨询处方医生。
    terms: []
    patterns:
      - '(建议|请|应该|需要|可以|立即|马上)?\s*(减少|增加|降低|加大|提高|调整|更改|更换|停用)[^，。；！？、：:/\n]{0,4}(剂量|药量)'
      - '(剂量|药量)[^，。；！？、：:/\n]{0,4}(减少|增加|降低|加大|提高|调整)'
      - '(停药|停用药物|换药|改药|调整用药)'
  - code: CHANGE_MEDICATION
    name: 更改用药方案
    message: 本系统不更改任何用药方案，请咨询处方医生。
    terms: ["药", "胰岛素", "二甲双胍", "格列", "阿卡波糖", "西格列汀", "达格列净", "司美格鲁肽", "利拉鲁肽"]
    patterns:
      - '(停|停止|停掉|停了|别吃|别服|不吃|不吃了|不用吃|断了|断掉)'
      - '(不想|不要|别再|不用)(吃|服|用)'
      - '(换|改|调整)(?:(?!和|以及|同时|并且)[^，。；！？、：:/\n]){0,6}(药|片|剂量|方案)'
      - '(加|减|多|少)(吃|服|用)(?:(?!和|以及)[^，。；！？、：:/\n]){0,3}(片|粒|次|量|剂量)'
      - '(加|减)(?:(?!和|以及)[^，。；！？、：:/\n]){0,4}(片|粒|颗)'
      - '(剂量|药量|药)(?:(?!和|以及|同时|并且)[^，。；！？、：:/\n]){0,4}(加|减|多|少|改|调整|换|停)'
      - '(增加|减少|加大|降低|提高|调整)[^，。；！？、：:/\n]{0,6}(剂量|药量)'
      - '(剂量|药量)[^，。；！？、：:/\n]{0,4}(增加|减少|加大|降低|提高)'
      - '(药|片)(?:(?!和|以及|同时|并且)[^，。；！？、：:/\n]){0,3}(停|换|改|加|减)'
      - '(增加|减少|加大|加量|减量|上调|下调|多服|少服)[^，。；！？、：:/\n]{0,2}(用药|药量|药物|剂量|服药)'
      - '(加|减|换|停)(用药|药物|药量|药)'
      - '(改为|改成|调整到|调整为)[^，。；\n]{0,4}(一天|每天|每日|一日)\s*(一次|两次|三次|1次|2次|3次|顿)'

# 需要转人工复核的红旗信号（不给出结论，只升级）
escalation_rules:
  - code: SEVERE_HYPOGLYCEMIA
    description: 记录到明确低血糖（<3.9 mmol/L）
    field: glucose
    op: lte
    threshold: 3.9
    severity: high
    message: 出现低血糖记录，已创建人工复核事项，请同时联系医生。
  - code: SEVERE_HYPERGLYCEMIA
    description: 空腹血糖显著升高（>=16.7 mmol/L）
    field: glucose
    op: gte
    threshold: 16.7
    severity: high
    message: 血糖显著升高，已创建人工复核事项。
  - code: SYMPTOM_ALERT
    description: 症状中提及胸痛、意识模糊、呕吐、呼吸急促、心慌出汗等需要关注的表现
    field: symptom
    keywords: ["胸痛", "意识模糊", "昏迷", "呕吐", "呼吸急促", "视力突然下降", "心慌", "冷汗", "手抖", "出冷汗", "晕倒"]
    severity: high
    message: 出现需关注的症状描述，已升级人工复核。

# 允许 Agent 自主执行的动作白名单（F10 工具白名单）
allowed_tools:
  - search_knowledge
  - ask_user
  - create_task
  - update_task
  - complete_task
  - query_history
  - schedule_review
  - create_notification
  - request_human_review
  - save_preference
  - get_preferences
  - list_tasks
  - parse_constraint
  - respond

# 需要计划校验的字段级限制
limits:
  max_tasks_per_run: 5
  max_questions_per_run: 2
  task_due_min_hours: 1
  task_due_max_days: 30
